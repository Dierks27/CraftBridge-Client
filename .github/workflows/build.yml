name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allows attaching the jars to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    # One job per Minecraft target in versions/. Both are released together: 26.2 for the live
    # server until the switch, 26.3 for the test server.
    strategy:
      fail-fast: false
      matrix:
        mc: [ '26.2', '26.3' ]
    name: build (Minecraft ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.7 runs on JDK 25 and both loaders compile for 25 (Minecraft 26.2 and 26.3's target).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Caches ~/.gradle including Loom's and NeoForm's remapped Minecraft, which is the slow
      # part of a first build and stable per Minecraft version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders for Minecraft ${{ matrix.mc }}
        run: ./gradlew build -PmcTarget=${{ matrix.mc }} --stacktrace

      - name: Upload jars as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craftbridge-client-jars-${{ matrix.mc }}
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jars to the release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" fabric/build/libs/*.jar neoforge/build/libs/*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" fabric/build/libs/*.jar neoforge/build/libs/*.jar --clobber

      # On every push to main, publish or refresh a Release named after modVersion, so a
      # downloadable pair of jars always tracks main without needing a tag push. Same
      # pattern as the CraftBridge plugin repo, and the two are released together. The jar names
      # carry the Minecraft version, so the two targets' jars sit side by side in one Release.
      - name: Publish Release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep '^modVersion=' gradle.properties | cut -d= -f2)"
          JARS=$(ls fabric/build/libs/*.jar neoforge/build/libs/*.jar | grep -v -- '-sources.jar$')
          # Both matrix jobs publish into the same Release, so either may find it missing and
          # lose the race to create it; the loser falls back to uploading.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $JARS --clobber
          else
            gh release create "$TAG" $JARS --title "$TAG" --generate-notes --target "$GITHUB_SHA" \
            || gh release upload "$TAG" $JARS --clobber
          fi
