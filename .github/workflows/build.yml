name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allows attaching the jars to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.7 runs on JDK 25 and both loaders compile for 25 (Minecraft 26.2's target).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Caches ~/.gradle including Loom's and NeoForm's remapped Minecraft, which is the slow
      # part of a first build and stable per Minecraft version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both loaders
        run: ./gradlew build --stacktrace

      - name: Upload jars as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craftbridge-client-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Attach jars to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
