modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Dierks27/CraftBridge-Client/issues"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "CraftBridge Client"
authors = "Dierks"
description = '''
Optional companion to the CraftBridge Paper plugin: lets JEI's [+] see every item in nearby
storage at a Linked Workbench, not just the 36 a server can fake. Does nothing on a server
without CraftBridge.
'''

[[dependencies.${modId}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforgeVersion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${modId}]]
modId = "jei"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
