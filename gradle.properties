org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Which Minecraft to build for: one of the files in versions/. Each target pins its own
# Minecraft, JEI, Fabric and NeoForge versions there. Build the other with -PmcTarget=26.3.
# 26.2 stays the default while the live server and the other players are on it.
mcTarget=26.2
javaVersion=25

modId=craftbridge_client
modVersion=0.3.0
modGroup=com.dierks.craftbridge
